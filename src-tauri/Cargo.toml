[package]
name = "quickno"
version = "1.0.2"
description = "Quickno - Lightning-fast AI assistant for Windows"
authors = ["Vinay7766"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-store = "=2.4.3"

serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.137" }
tokio = { version = "1.43.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "http2", "stream"] }
thiserror = "2.0.11"
keyring = { version = "3.6.1", features = ["windows-native"] }
open = "5.3"
urlencoding = "2.1"
tauri-plugin-os = "2.3.0"
screenshots = "0.8.10"
base64 = "0.22.1"
enigo = "0.2.1"
boa_engine = "0.21.1"
walkdir = "2.5.0"
# Windows AV workaround
[profile.release]
codegen-units = 1

[profile.dev]
codegen-units = 1

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
