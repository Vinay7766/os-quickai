name: "Release OS QuickAI"

on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # This will be replaced by the action
          releaseName: "Quickno v__VERSION__"
          releaseBody: "Official release of Quickno. Visit https://www.quickno.in/ for more information."
          releaseDraft: false
          prerelease: false
          args: --verbose
