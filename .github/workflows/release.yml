name: "Release OS QuickAI"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon and Intel
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04" # for Linux
            args: ""
          - platform: "windows-latest" # for Windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # This will be replaced by the action
          releaseName: "Quickno v__VERSION__"
          releaseBody: "Initial public release of Quickno. A lightning-fast, AI-powered global search assistant for Windows, macOS, and Linux.\n\nOfficial Website: https://www.quickno.in/\n\nKey Features:\n- Global Hotkey (Alt+A / Cmd+A)\n- Built-in Free AI Models\n- Secure API Key Management\n- Smart Web & AI Site Integration\n- High-fidelity Settings Interface with Auto-save"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
